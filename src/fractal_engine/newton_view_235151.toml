name = "Newton (z^3 - 1)"
step = "z - (z**3 - 1) / (3 * z**2)"

[setup]
z = "p"

[stop]
mode = "converge"
radius = 256.0
degree = 2.0
tolerance = 1e-09
periodicity = true

[view]
center = [np.float64(6.692292566463717e-53), np.float64(-1.6545652421421011e-52)]
width = 1.0022867662845734e-51
max_iter = 800

[colour]
cmap = "twilight_shifted"
